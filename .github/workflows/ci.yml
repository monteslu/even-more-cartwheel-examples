name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a push to main never wipes out the run before it

env:
  # every game in the repo (the release ships one cart each)
  GAMES: "destructo emberthrone jewels lanternfall pinball skate towers"
  # games with a self-playing <game>_auto cart (the others smoke-test their own cart)
  AUTO_GAMES: "destructo emberthrone jewels lanternfall pinball skate towers"
  # games whose text passes the engine's prompt check (tools/check-prompts.mjs)
  PROMPT_GAMES: "destructo emberthrone jewels lanternfall pinball skate towers"

# The games ship as dual GL + WebGPU carts (.wasc), built against the prebuilt
# cart SDK pinned in scripts/deps.lock (cartwheel-engine's release asset):
# only the games compile.
jobs:
  carts:
    name: Carts
    # a v* tag builds its own carts: each cart's manifest carries the version its checkout is (the
    # engine's cw_add_app: the tag on a tag build, <last tag>-dev.g<commit> on any other)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the version (commits only: no old trees or files)
          filter: tree:0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mesa-vulkan-drivers libvulkan1 libgles2 libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh') }}
      - name: Fetch the SDKs
        run: scripts/fetch-deps.sh
      # controls are shown with the engine's button prompts (cartwheel/prompt.h), never a maker's button names
      - name: Check prompts
        run: for g in $PROMPT_GAMES; do node deps/cartwheel-engine/tools/check-prompts.mjs games/$g || exit 1; done
      # towers' maps: every gate reaches the core, pads beside the path in fair shares, every prop grounded, its bake
      # present and current, and held by two bots in the native soak build; the controls (maps broken on purpose)
      # must each fail
      - name: Check towers' maps
        run: |
          TARGETS=native scripts/build.sh towers_soak
          node games/towers/tools/check-maps.mjs --soak build/native/games/towers/towers_soak
      # skate's board against ramp physics (a naive one-step solver must fail) and its parks: nothing floats, every
      # line skated by a bot through the real controls; the controls (parks broken on purpose) must each fail; a near
      # miss at a runnable pace is run out on foot (every miss a fall must fail)
      - name: Check skate's physics and parks
        run: |
          TARGETS=native scripts/build.sh skate_check
          node tests/skate-physics.mjs
          node tests/skate-parks.mjs
          node tests/skate-runout.mjs
      # pinball's ball and flippers: nothing through a wall or a firing flipper (a naive one-step solver must fail),
      # and the flipper buttons live until the ball has gone (the rule that killed them at the drain line must fail)
      - name: Check pinball's physics and flippers
        run: |
          TARGETS=native scripts/build.sh pinball_physcheck pinball_flipcheck pinball_flipcheck_oldrule
          node tests/pinball-physics.mjs
          node tests/pinball-drain.mjs
      # lanternfall's world: the shipped world and route are current, the checker proves it completable in ability
      # order with no soft locks, every pickup reached, every gate holding, nothing floating; the controls (worlds
      # broken on purpose) must each fail; the movement's feel stays in its bounds and the combat rules hold (each with
      # its controls)
      - name: Check lanternfall's world, feel and rules
        run: |
          TARGETS=native scripts/build.sh lanternfall_worldgen lanternfall_check lanternfall_feel lanternfall_rules
          node tests/lanternfall-world.mjs
          node tests/lanternfall-feel.mjs
          node tests/lanternfall-rules.mjs
      # no surface fights another for the depth test: every map, level, park and table of the 3D games scanned for
      # overlapping faces in one plane (software GL: Mesa's llvmpipe); the detector's selftest and a doubled face added
      # to a real scene must each be found
      - name: Check that no faces fight for the depth test
        run: |
          TARGETS=native scripts/build.sh towers_auto destructo_auto emberthrone_auto skate_auto pinball_auto
          CW_GPU_SUITE_INNER=1 node tests/coplanar.mjs
      # pushes to main and v* tags link the carts as releases ship (ThinLTO, wasm-opt); pull requests
      # link dev carts, the same simulation
      - name: Build the carts (each game, and its self-playing <game>_auto where it has one)
        run: |
          [ "${GITHUB_EVENT_NAME}" = pull_request ] || export RELEASE=1
          [ -n "$GAMES" ] || { echo "no games yet"; exit 0; }
          TARGETS=cart-wgpu scripts/build.sh $GAMES $(for g in $AUTO_GAMES; do echo ${g}_auto; done)
      # every release cart carries its launcher art (games/<game>/art, project.cwproj art/description/author)
      - name: Cart art
        if: env.GAMES != ''
        run: node tests/cart-art.mjs $GAMES
      # every cart's manifest version is this build's: the tag on a v* tag (a release version), else this
      # checkout's <last tag>-dev.g<commit>; the control (a cart rewritten to another version) must fail
      - name: Cart version
        if: env.GAMES != ''
        run: node tests/cart-version.mjs $GAMES
      - name: Smoke test (each game's cart in wasmcart's Node host on lavapipe, WebGPU)
        if: env.GAMES != ''
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json node tests/cart-smoke.mjs --frames 60 $GAMES
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cart-smoke
          path: out/cart-smoke/
          retention-days: 7
      - name: Collect carts
        run: |
          mkdir -p carts
          for g in $GAMES; do cp build/cart-wgpu/carts/$g.wasc carts/$g.wasc; done
          ls -l carts
      - uses: actions/upload-artifact@v7
        with:
          name: release-carts
          path: carts/*.wasc
          retention-days: 30
          if-no-files-found: ${{ env.GAMES != '' && 'error' || 'ignore' }}

  release:
    name: Release
    needs: carts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # a v* tag publishes the carts as a GitHub release
      actions: read # the tagged commit's run on main
    steps:
      - uses: actions/checkout@v7 # CHANGELOG.md: the release notes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # tag only commits whose push to main has a green run
      - name: The tagged commit is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$id" ] || { echo "no green CI run on main for $GITHUB_SHA: push it to main and wait for green before tagging" >&2; exit 1; }
      # the carts this tag built, each carrying the tag's version
      - uses: actions/download-artifact@v7
        with:
          name: release-carts
          path: files
      - name: Every cart is the tag's version
        run: node tests/cart-version.mjs --dir files
      - name: Release (v* tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          for g in $GAMES; do [ -f files/$g.wasc ] || { echo "no $g.wasc" >&2; exit 1; }; done
          # the notes are the version's CHANGELOG.md section
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$1 == "##" { if (on) exit; on = ($2 == v) ; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no ## $v section" >&2; exit 1; }
          cat notes.md
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber files/*.wasc
